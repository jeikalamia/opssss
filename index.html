<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Happy Birthday! 🕷️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: radial-gradient(
                circle at center,
                #163b63 0%,
                #07111f 55%,
                #03070d 100%
            );
            font-family: Arial, sans-serif;
        }

        /* SPIDER WEB BACKGROUND */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                repeating-radial-gradient(
                    circle at center,
                    transparent 0 35px,
                    rgba(255,255,255,0.08) 36px 38px
                ),
                repeating-conic-gradient(
                    from 0deg,
                    transparent 0deg 14deg,
                    rgba(255,255,255,0.07) 15deg 16deg
                );
            opacity: 0.6;
            pointer-events: none;
        }

        /* RED GLOW */
        body::after {
            content: "";
            position: fixed;
            width: 350px;
            height: 350px;
            background: #e00000;
            filter: blur(130px);
            opacity: 0.18;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* TAP TO OPEN */
        #startScreen {
            position: fixed;
            inset: 0;
            background: #050b13;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #startButton {
            padding: 18px 30px;
            border: 3px solid #e00000;
            border-radius: 18px;
            background: #111923;
            color: white;
            font-size: 18px;
            font-weight: bold;
            box-shadow:
                0 0 15px #e00000,
                0 0 35px rgba(224,0,0,0.5);
            animation: buttonPulse 1.5s infinite;
        }

        #startButton span {
            display: block;
            font-size: 42px;
            margin-bottom: 8px;
        }

        /* WEB CORNERS */
        .web {
            position: fixed;
            color: rgba(255,255,255,0.35);
            font-size: clamp(55px, 15vw, 80px);
            z-index: 1;
            pointer-events: none;
        }

        .web1 {
            top: -15px;
            left: -10px;
        }

        .web2 {
            top: -15px;
            right: -10px;
            transform: rotate(90deg);
        }

        .web3 {
            bottom: -15px;
            left: -10px;
            transform: rotate(270deg);
        }

        .web4 {
            bottom: -15px;
            right: -10px;
            transform: rotate(180deg);
        }

        /* PHOTOS */
        .polaroid {
            position: fixed;
            width: clamp(82px, 24vw, 105px);
            padding: 5px 5px 18px;
            background: #11151c;
            border: 2px solid #e00000;
            box-shadow:
                0 0 10px rgba(224,0,0,0.7),
                0 5px 15px rgba(0,0,0,0.7);
            opacity: 0;
            z-index: 3;
        }

        .polaroid img {
            width: 100%;
            height: clamp(70px, 20vw, 90px);
            object-fit: cover;
            display: block;
            border: 2px solid #222;
        }

        .polaroid::after {
            content: "🕷️";
            position: absolute;
            bottom: 0;
            right: 4px;
            font-size: 11px;
        }

        /* TOP */
        .photo1 {
            top: 5%;
            left: 3%;
            animation: photo1 1s ease forwards;
            animation-delay: 0.5s;
        }

        .photo2 {
            top: 3%;
            left: 50%;
            animation: photo2 1s ease forwards;
            animation-delay: 0.8s;
        }

        .photo3 {
            top: 5%;
            right: 3%;
            animation: photo3 1s ease forwards;
            animation-delay: 1.1s;
        }

        /* BOTTOM */
        .photo4 {
            bottom: 5%;
            left: 3%;
            animation: photo4 1s ease forwards;
            animation-delay: 1.4s;
        }

        .photo5 {
            bottom: 3%;
            left: 50%;
            animation: photo5 1s ease forwards;
            animation-delay: 1.7s;
        }

        .photo6 {
            bottom: 5%;
            right: 3%;
            animation: photo6 1s ease forwards;
            animation-delay: 2s;
        }

        /* CENTER CARD */
        .card {
            position: fixed;
            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            width: min(78vw, 320px);
            max-height: 52vh;

            padding: clamp(15px, 4vw, 24px) 15px;

            background: linear-gradient(
                145deg,
                #181d27,
                #080c13
            );

            border: 3px solid #e00000;
            border-radius: 25px;

            text-align: center;

            box-shadow:
                0 0 15px #e00000,
                0 0 40px rgba(224,0,0,0.4);

            z-index: 5;

            animation: cardIn 1.2s ease;
        }

        .spider {
            font-size: clamp(35px, 11vw, 50px);
            animation: spiderBounce 1.5s infinite;
            filter: drop-shadow(0 0 8px #e00000);
        }

        h1 {
            color: #ff2020;
            font-size: clamp(23px, 7vw, 30px);
            font-weight: 900;
            margin: 5px 0;

            text-shadow: 0 0 10px rgba(255,0,0,0.7);
        }

        h2 {
            color: white;
            font-size: clamp(15px, 4.5vw, 19px);
            margin: 8px 0;
        }

        p {
            color: #d7dce3;
            font-size: clamp(12px, 3.7vw, 15px);
            font-weight: bold;
            line-height: 1.45;
            margin: 8px 0;
        }

        .web-line {
            width: 80%;
            height: 2px;
            margin: 10px auto;
            background: #e00000;
            box-shadow: 0 0 8px #e00000;
        }

        /* FLOATING SPIDERS */
        .floating-spider {
            position: fixed;
            font-size: clamp(20px, 7vw, 25px);
            z-index: 2;
            animation: floatSpider 4s infinite ease-in-out;
        }

        .spider1 {
            top: 30%;
            left: 12%;
        }

        .spider2 {
            top: 65%;
            right: 10%;
            animation-delay: 1s;
        }

        .spider3 {
            top: 22%;
            right: 17%;
            animation-delay: 2s;
        }

        /* ANIMATIONS */

        @keyframes buttonPulse {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.7);
            }

            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        @keyframes spiderBounce {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        @keyframes floatSpider {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-20px) rotate(10deg);
            }
        }

        @keyframes photo1 {
            from {
                opacity: 0;
                transform: rotate(-15deg) translateY(-30px);
            }

            to {
                opacity: 1;
                transform: rotate(-8deg);
            }
        }

        @keyframes photo2 {
            from {
                opacity: 0;
                transform: translate(-50%, -30px) rotate(8deg);
            }

            to {
                opacity: 1;
                transform: translateX(-50%) rotate(4deg);
            }
        }

        @keyframes photo3 {
            from {
                opacity: 0;
                transform: rotate(15deg) translateY(-30px);
            }

            to {
                opacity: 1;
                transform: rotate(8deg);
            }
        }

        @keyframes photo4 {
            from {
                opacity: 0;
                transform: rotate(15deg) translateY(30px);
            }

            to {
                opacity: 1;
                transform: rotate(8deg);
            }
        }

        @keyframes photo5 {
            from {
                opacity: 0;
                transform: translate(-50%, 30px) rotate(-8deg);
            }

            to {
                opacity: 1;
                transform: translateX(-50%) rotate(-4deg);
            }
        }

        @keyframes photo6 {
            from {
                opacity: 0;
                transform: rotate(-15deg) translateY(30px);
            }

            to {
                opacity: 1;
                transform: rotate(-8deg);
            }
        }

    </style>
</head>

<body>

    <!-- MUSIC -->
    <audio id="birthdayMusic" loop>
        <source src="spideyy.mp3" type="audio/mpeg">
    </audio>

    <!-- TAP TO OPEN -->
    <div id="startScreen">
        <button id="startButton">
            <span>🕷️</span>
            TAP TO OPEN
        </button>
    </div>

    <!-- WEB CORNERS -->
    <div class="web web1">🕸️</div>
    <div class="web web2">🕸️</div>
    <div class="web web3">🕸️</div>
    <div class="web web4">🕸️</div>

    <!-- PHOTOS -->

    <div class="polaroid photo1">
        <img src="pic1.jpeg">
    </div>

    <div class="polaroid photo2">
        <img src="pic2.jpeg">
    </div>

    <div class="polaroid photo3">
        <img src="pic3.jpeg">
    </div>

    <div class="polaroid photo4">
        <img src="pic4.jpeg">
    </div>

    <div class="polaroid photo5">
        <img src="pic5.jpeg">
    </div>

    <div class="polaroid photo6">
        <img src="pic6.jpeg">
    </div>

    <!-- CENTER CARD -->

    <div class="card">

        <div class="spider">🕷️</div>

        <h1>HAPPY BIRTHDAY LUV!</h1>

        <div class="web-line"></div>

        <h2>Stay being a sexy spideyy babe</h2>

        <p>
            My wish for you is sana sumakses ka sa iyong study mwah
            <br><br>
            Enjoy your special day zyra namin!
        </p>

        <div class="web-line"></div>

        <div style="font-size:35px;">
            🎂
        </div>

    </div>

    <!-- FLOATING SPIDERS -->

    <div class="floating-spider spider1">🕷️</div>
    <div class="floating-spider spider2">🕷️</div>
    <div class="floating-spider spider3">🕷️</div>

    <script>

        const startScreen =
            document.getElementById("startScreen");

        const startButton =
            document.getElementById("startButton");

        const music =
            document.getElementById("birthdayMusic");

        startButton.addEventListener("click", function () {

            music.play().catch(function(error) {
                console.log("Music could not play:", error);
            });

            startScreen.style.opacity = "0";

            setTimeout(function () {
                startScreen.style.display = "none";
            }, 500);

        });

    </script>

</body>
</html>
